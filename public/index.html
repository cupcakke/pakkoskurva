<style>
html, body, #app{
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}
input, textarea, select, button, [contenteditable="true"]{
  font-size: 16px !important;
  max-height: 100%;
}

:root{
  color-scheme: dark;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --blue: #0000ff;              --blue-l: #00ff00;
  --accent: #0000ff;            --green-soft: #ffffff;
  --fg: #f5f5f7;                --fg2: rgba(245,245,247,.58);
  --fg3: rgba(245,245,247,.28); --bg: #000000;
  --sep: rgba(255,255,255,.055);--hover: rgba(255,255,255,.055);
  --liquid: rgba(246,246,250,.018);
  --liquid2: rgba(0,40,218,.033);
  --liquid3: rgba(255,255,255,.015);
  --liquid-border: rgba(0,0,0,.068);
  --liquid-border-strong: rgba(232,232,246,.118);
  --liquid-inset: rgba(255,255,255,.105);
  --liquid-edge: rgba(255,255,255,.08);
  --liquid-shadow: rgba(0,0,10,.34);
  --input-glow: rgba(11,0,246,.118);
  --send-border: rgba(0,9,205,.22);
  --send-inset: rgba(255,255,255,.18);
  --send-shadow: rgba(80,90,255,.18);
}

*{ box-sizing: border-box; margin: 0; padding: 0; }
html{
  width: 100%; height: 100%; overflow: hidden;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  background: var(--bg);
}
body{
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--fg);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  touch-action: pan-y;
}
input, textarea, [contenteditable="true"], .bubble, .ai-bubble, .bubble *, .ai-bubble *, pre, code, .cb, .cb *{
  -webkit-user-select: text; user-select: text;
  -webkit-touch-callout: default;
}
button, a, label, summary, svg, img{
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-user-drag: none;
}
button, input, textarea{ font: inherit; appearance: none; -webkit-appearance: none; }
textarea{ border-radius: 0; }

#bg{
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: #000000;
}
#bg::before{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg,#4b6cf7 0%,#000 50%,#0009cd 100%);
  opacity: .15;
  filter: blur(80px);
}
#bg::after{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.98));
}

#app{
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  width: 100%; height: 100vh; height: 100dvh;
  min-height: 100vh; min-height: 100dvh;
  overflow: hidden;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
}

.lg{
  position: relative; overflow: hidden; isolation: isolate;
  transform: translateZ(0);
  background: linear-gradient(145deg, var(--liquid2), var(--liquid3) 48%, var(--liquid));
  border: .45px solid var(--liquid-border);
  box-shadow: 0 .7px 0 var(--liquid-inset) inset, 0 -.45px 0 rgba(0,0,0,.14) inset, 0 0 0 .35px rgba(80,90,255,.07), 0 14px 42px var(--liquid-shadow);
  -webkit-backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
  backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
}
.lg:before{
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(150deg, rgba(255,255,255,.105), rgba(255,255,255,.022) 34%, rgba(80,90,255,.035) 58%, rgba(11,0,246,.025));
  mix-blend-mode: screen;
}
.lg:after{
  content: "";
  position: absolute; inset: .5px;
  border-radius: inherit;
  pointer-events: none;
  border: .35px solid rgba(255,255,255,.035);
  box-shadow: 0 0 18px rgba(80,90,255,.04) inset;
}
.lg > *{ position: relative; z-index: 1; }

#sidebar{
  position: fixed; top: 0; bottom: 0; left: 0; right: 0;
  width: 100%; max-width: 100%;
  z-index: 310;
  padding-top: var(--sat); padding-left: var(--sal); padding-right: var(--sar);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .42s cubic-bezier(.32,.72,0,1.18);
  will-change: transform;
  background: rgba(2,8,5,.18);
  -webkit-backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
  backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
  transform-style: preserve-3d;
}
#sidebar.open{ transform: translateX(0); }
#sidebar.dragging{ transition: none; }
#sidebar[aria-hidden="true"]{ pointer-events: none; }
#sidebar[aria-hidden="false"]{ pointer-events: auto; }

.sb-backdrop{
  position: fixed; inset: 0; z-index: 309;
  background: rgba(0,0,0,.5);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none;
  transition: opacity .35s cubic-bezier(.25,1,.5,1);
}
.sb-backdrop.open{ opacity: 1; pointer-events: auto; }

.sb-hdr{
  height: 52px; display: flex; align-items: center;
  padding: 0 12px;
  border-bottom: .5px solid var(--sep);
  gap: 8px; flex-shrink: 0;
}
.sb-title{
  flex: 1; text-align: center;
  font-size: 15px; font-weight: 600; letter-spacing: -.3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sb-close{
  width: 30px; height: 30px; border-radius: 50%;
  background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg2);
}
.sb-close:active{ transform: scale(.88); opacity: .7; }
.sb-close svg{ width: 17px; height: 17px; }

#sb-search-bar{
  height: 0; visibility: hidden; overflow: hidden;
  transition: height .32s cubic-bezier(.34,1.28,.64,1), visibility .32s;
}
#sb-search-bar.open{ height: 54px; visibility: visible; }

.sb-si{
  height: 38px; margin: 8px 14px 6px; border-radius: 18px;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
}
.sb-si svg{ width: 16px; height: 16px; fill: var(--fg3); flex-shrink: 0; }

#sb-q{
  flex: 1; background: transparent; border: none; outline: none;
  font-size: 16px !important; color: var(--fg); min-width: 0;
}
#sb-q::placeholder{ color: var(--fg3); }

#sb-q-cancel{
  background: transparent; border: none; color: var(--green-soft);
  font-size: 15px; width: 0; opacity: 0; pointer-events: none; overflow: hidden;
  transition: width .2s, opacity .2s; white-space: nowrap;
}
#sb-search-bar.open #sb-q-cancel{ width: 52px; opacity: 1; pointer-events: auto; }

.sb-body{
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 12px;
}
.sb-body::-webkit-scrollbar, #scroll-area::-webkit-scrollbar, .img-strip::-webkit-scrollbar, .src-chips::-webkit-scrollbar, #ta::-webkit-scrollbar{
  display: none;
}
.sb-body, #scroll-area, .img-strip, .src-chips, #ta{
  scrollbar-width: none;
}

.sb-pull-hint{
  display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 6px 0 0; font-size: 11px; color: var(--fg3);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sb-pull-hint svg{ width: 12px; height: 12px; }
#sidebar.pull-hinting .sb-pull-hint{ opacity: 1; }

.sb-new{
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-radius: 16px; margin-bottom: 10px;
  font-size: 13.5px; font-weight: 500; color: var(--green-soft);
  text-align: left; border: none; background: transparent;
}
.sb-new svg{ width: 16px; height: 16px; fill: var(--green-soft); flex-shrink: 0; }
.sb-new:active, .hcard:active{ transform: scale(.97); }

.sb-sec{
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--fg3); letter-spacing: .5px; padding: 2px 3px 8px; margin-top: 4px;
}

.hcard{
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 12px; border-radius: 16px;
  background: transparent; border: .5px solid transparent;
  margin-bottom: 6px;
  transition: transform .22s cubic-bezier(.2,1,.3,1), background .14s, border-color .14s;
}
@media (hover:hover) and (pointer:fine){
  .hcard:hover{
    background: var(--hover);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    border-color: var(--liquid-border-strong);
  }
}
.hcard.active{
  background: linear-gradient(135deg, rgba(11,0,246,.075), rgba(80,90,255,.07));
  border-color: rgba(80,90,255,.25);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 0 0 .35px rgba(80,90,255,.06), 0 8px 28px rgba(80,90,255,.05);
}
.hcard-body{ flex: 1; min-width: 0; }
.hcard-pre{
  font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; letter-spacing: -.15px;
}
.hcard-pre mark{
  background: rgba(80,90,255,.18); color: var(--green-soft);
  border-radius: 3px; padding: 0 1px;
}
.hcard.active .hcard-pre{ color: var(--green-soft); }
.hcard-meta{ font-size: 11px; color: var(--fg3); margin-top: 2px; }
.hcard-del{
  width: 24px; height: 24px; border-radius: 8px; background: transparent; border: none;
  color: var(--fg3); opacity: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.hcard-del svg{ width: 14px; height: 14px; fill: currentColor; }
.hcard:hover .hcard-del, .hcard:focus-within .hcard-del{ opacity: 1; pointer-events: auto; }
@media (pointer: coarse){
  .hcard-del{ opacity: 1; pointer-events: auto; }
}
.hcard-del:active{ background: rgba(255,59,48,.15); color: rgba(255,59,48,.85); transform: scale(.85); }

.hcard-pin{ display: none; width: 11px; height: 11px; margin-right: 3px; vertical-align: middle; }
.hcard.pinned .hcard-pin{ display: inline-block; }
.hcard-pin svg{ fill: var(--green-soft); }

.hcard-pre[contenteditable="true"]{
  outline: none; background: rgba(0,255,157,.1); border-radius: 7px;
  padding: 2px 5px; margin: -2px -5px; white-space: normal;
}

.h-empty{
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; padding: 48px 16px; text-align: center;
}
.h-empty svg{ width: 28px; height: 28px; fill: var(--fg3); opacity: .45; }
.h-empty p{ font-size: 13px; color: var(--fg3); line-height: 1.5; }

#content{
  flex: 1; overflow: hidden; position: relative; z-index: 1;
  touch-action: pan-y; display: flex; flex-direction: column; min-height: 0;
}
#scroll-area{
  flex: 1; position: relative; top: 0; right: 0; bottom: 0; left: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain; touch-action: pan-y;
  padding: 12px 0 20px; padding-top: calc(12px + var(--sat));
  scroll-padding-top: 20px; scroll-padding-bottom: 20px;
  min-height: 0;
}
#msg-list{
  display: flex; flex-direction: column;
  padding: 0 calc(14px + var(--sar)) 0 calc(14px + var(--sal));
  min-height: 100%;
}
.msg-group{ display: flex; flex-direction: column; margin-bottom: 8px; }
.msg-group.u{ align-items: flex-end; }
.msg-group.a{ align-items: flex-start; }
.bubble, .ai-bubble{
  max-width: 100%; font-size: 15px; line-height: 1.5; letter-spacing: -.18px;
  word-break: break-word; overflow-wrap: anywhere; position: relative;
}
.u .bubble{
  color: #f7fffb; max-width: 85%; padding: 9px 14px; border-radius: 20px;
  background: linear-gradient(138deg, rgba(0,9,205,.78) 0%, rgba(80,90,255,.72) 48%, rgba(95,106,247,.66) 100%);
  border: .45px solid rgba(160,170,255,.32);
  box-shadow: 0 5px 26px rgba(80,90,255,.15), 0 3px 18px rgba(11,0,246,.08), 0 1.2px 0 rgba(255,255,255,.22) inset, 0 -.7px 0 rgba(0,0,0,.16) inset;
  -webkit-backdrop-filter: blur(24px) saturate(175%);
  backdrop-filter: blur(24px) saturate(175%);
}
.ai-bubble{ padding: 4px 0; background: transparent; border: none; box-shadow: none; }
.thinking{
  width: min(100%, 680px); margin: 4px 0 9px; border: 1px solid var(--sep);
  border-radius: 12px; background: rgba(255,255,255,.035); overflow: hidden;
}
.thinking summary{
  cursor: pointer; padding: 9px 12px; color: var(--fg2); font-size: 12px;
  user-select: none; list-style: none;
}
.thinking summary::-webkit-details-marker{ display: none; }
.thinking summary:before{ content: "›"; display: inline-block; margin-right: 7px; transition: transform .2s; }
.thinking[open] summary:before{ transform: rotate(90deg); }
.thinking-text{
  padding: 0 12px 11px; color: var(--fg3); font-size: 12px; line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere; user-select: text;
}

.md p{ margin: 0 0 8px; }
.md p:last-child{ margin-bottom: 0; }
.md h1, .md h2, .md h3{ margin: 12px 0 7px; line-height: 1.3; font-weight: 600; }
.md h1{ font-size: 19px; }
.md h2{ font-size: 17px; }
.md h3{ font-size: 15.5px; }
.md ul, .md ol{ margin: 6px 0 8px; padding-left: 22px; }
.md li{ margin: 3px 0; }
.md a{ color: var(--green-soft); text-decoration: none; }
.md hr{ border: none; border-top: 1px solid var(--sep); margin: 12px 0; }
.md .ic{
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: .88em; background: rgba(255,255,255,.045);
  padding: 1.5px 5px; border-radius: 6px; border: .5px solid var(--liquid-border);
}
.md table{
  width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px;
  border-radius: 10px; overflow: hidden; border: 1px solid var(--sep);
}
.md th{
  padding: 7px 11px; text-align: left; font-size: 11px; font-weight: 600;
  text-transform: uppercase; color: var(--fg2); letter-spacing: .3px;
  border-bottom: 1px solid var(--sep); white-space: nowrap;
}
.md td{ padding: 7px 11px; border-bottom: 1px solid var(--sep); vertical-align: top; }
.md tr:last-child td{ border-bottom: none; }

.err-bbl{
  display: inline-block; max-width: 90%; margin: 4px 0; padding: 9px 13px;
  font-size: 13.5px; line-height: 1.45; background: rgba(0,255,157,.095);
  border: .5px solid rgba(0,255,157,.2); border-radius: 15px; word-break: break-word;
}
.rcn-bar{
  display: flex; align-items: center; gap: 7px; margin: 5px 14px; padding: 8px 12px;
  background: rgba(0,40,218,.08); border: .5px solid rgba(0,40,218,.16);
  border-radius: 13px; font-size: 12px; color: rgba(80,90,255,.9);
}
.rcn-bar svg{ width: 13px; height: 13px; fill: currentColor; animation: spin 1.1s linear infinite; }

.typing{ display: flex; align-items: center; gap: 4px; padding: 10px 2px; }
.td{ width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); animation: tbounce 1.3s infinite ease-in-out; }
.td:nth-child(2){ animation-delay: .18s; }
.td:nth-child(3){ animation-delay: .36s; }
@keyframes tbounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: .4; }
  30%{ transform: translateY(-5px); opacity: 1; }
}
@-webkit-keyframes tbounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: .4; }
  30%{ transform: translateY(-5px); opacity: 1; }
}
.t-row{ display: flex; align-items: center; gap: 4px; margin-top: 3px; pointer-events: auto; opacity: .85; }
.tact{
  display: flex; align-items: center; gap: 4px; background: transparent;
  border: .5px solid transparent; color: var(--fg3); font-size: 11.5px;
  padding: 3px 7px; border-radius: 8px;
}
.tact:active{ transform: scale(.9); }
.tact svg{ width: 13px; height: 13px; fill: currentColor; }
.btime{ font-size: 11px; color: var(--fg3); padding: 0 4px; }

#ib-wrap{
  position: relative; z-index: 200;
  padding-bottom: var(--sab); padding-left: var(--sal); padding-right: var(--sar);
  background: transparent; overflow: visible; pointer-events: none;
  flex-shrink: 0; align-self: flex-start; width: 100%;
}
[data-native-app="true"] #ib-wrap{ position: relative; flex-shrink: 0; }

.ib-inner{ padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; pointer-events: auto; background: transparent; }

.img-strip{ display: flex; gap: 7px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 1px 1px; }
.img-thumb{ position: relative; flex-shrink: 0; }
.img-thumb img{ width: 50px; height: 50px; object-fit: cover; border-radius: 13px; }
.img-rm{
  position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(5,12,8,.58); border: .45px solid var(--liquid-border-strong);
  display: flex; align-items: center; justify-content: center; font-size: 10px;
  color: var(--fg2);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
}
.ib-row{ display: flex; align-items: flex-end; gap: 8px; }
.ibtn, .sbtn{
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: transform .22s cubic-bezier(.34,1.4,.64,1), opacity .12s;
}
.ibtn{ color: rgba(246,255,249,.72); border: none; background: transparent; }
.ibtn svg{ width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ibtn:active, .sbtn:not(:disabled):active{ opacity: .72; transform: scale(.85); }

.ibox{

      var mo = new MutationObserver(function(){ interceptTA(); });
      mo.observe(document.body, { childList: true, subtree: true });
    }

    if(document.readyState === "loading"){
      document.addEventListener("DOMContentLoaded", ready);
    } else {
      ready();
    }
  }

  function _setupHapticTracking(){
    if(!_hasHapticBridge()) return;

    function attachHapticListener(el){
      var type = el.getAttribute("data-haptic");
      if(!type || el._hapticBound) return;
      el._hapticBound = true;
      el.addEventListener("touchstart", function(){
        try{
          window.webkit.messageHandlers.hapticBridge.postMessage({ type: type, intensity: 1.0 });
        }catch(e){}
      }, { passive: true });
    }

    function scanAll(){
      var list = document.querySelectorAll("[data-haptic]");
      for(var i = 0; i < list.length; i++) attachHapticListener(list[i]);
    }

    function ready(){
      scanAll();
      var mo = new MutationObserver(function(mutations){
        for(var i = 0; i < mutations.length; i++){
          var m = mutations[i];
          if(m.type === "childList"){
            m.addedNodes.forEach(function(node){
              if(node.nodeType !== 1) return;
              if(node.hasAttribute && node.hasAttribute("data-haptic")) attachHapticListener(node);
              if(node.querySelectorAll){
                var descendants = node.querySelectorAll("[data-haptic]");
                for(var j = 0; j < descendants.length; j++) attachHapticListener(descendants[j]);
              }
            });
          } else if(m.type === "attributes" && m.attributeName === "data-haptic"){
            attachHapticListener(m.target);
          }
        }
      });
      mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-haptic"] });
    }

    if(document.readyState === "loading"){
      document.addEventListener("DOMContentLoaded", ready);
    } else {
      ready();
    }
  }

  function _onDOMReady(){
    if(!_anyBridge()) return;
    _setupLayoutTracking();
    scheduleBridgeFlush();
  }

  _setupInputInterception();
  _setupHapticTracking();

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", _onDOMReady);
  } else {
    _onDOMReady();
  }

  window.__nativeBridge = {
    scheduleBridgeFlush: scheduleBridgeFlush,
    onInputDismissed: function(){
      var ta = document.getElementById("ta");
      if(ta){
        var ev = new Event("blur", { bubbles: true });
        ta.dispatchEvent(ev);
      }
      scheduleBridgeFlush();
    },
    onTextSync: function(text){
      var ta = document.getElementById("ta");
      if(!ta) return;
      ta.value = text;
      ta.dispatchEvent(new Event("input", { bubbles: true }));
      ta.dispatchEvent(new Event("change", { bubbles: true }));
    },
    onKeyboardShow: function(height){
      document.documentElement.style.setProperty("--native-keyboard-height", height + "px");
      var ta = document.getElementById("ta");
      if(ta){
        ta.dispatchEvent(new CustomEvent("nativekeyboardshow", { bubbles: true, detail: { height: height } }));
      }
      scheduleBridgeFlush();
    },
    onKeyboardHide: function(){
      document.documentElement.style.setProperty("--native-keyboard-height", "0px");
      var ta = document.getElementById("ta");
      if(ta){
        ta.dispatchEvent(new CustomEvent("nativekeyboardhide", { bubbles: true }));
      }
      scheduleBridgeFlush();
    },
    triggerSend: function(){
      if(window.chatApp && typeof window.chatApp.send === "function"){
        window.chatApp.send();
        return;
      }
      var ta = document.getElementById("ta");
      if(!ta) return;
      var start = ta.selectionStart || 0;
      var end = ta.selectionEnd || 0;
      var val = ta.value;
      ta.value = val.slice(0, start) + "\n" + val.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 1;
      ta.dispatchEvent(new Event("input", { bubbles: true }));
      ta.dispatchEvent(new Event("change", { bubbles: true }));
    },
    getInputText: function(){
      var ta = document.getElementById("ta");
      return ta ? ta.value : "";
    }
  };
})();
</script>
</head>
<body>

<canvas id="glass-renderer-canvas" aria-hidden="true"></canvas>
<div id="bg" aria-hidden="true"></div>

<div id="app">

  <div id="sidebar-backdrop" class="sb-backdrop" aria-hidden="true"></div>

  <div id="sidebar" aria-hidden="true">
    <div class="sb-hdr">
      <span class="sb-title">Előzmények</span>
      <button class="sb-close" id="btn-sb-search" aria-label="Keresés">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>

    <div id="sb-search-bar">
      <div class="sb-si lg">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="sb-q" type="text" placeholder="Keresés" autocomplete="off" spellcheck="false">
        <button id="sb-q-cancel">Mégsem</button>
      </div>
    </div>

    <div class="sb-body">
      <div class="sb-pull-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <span>Húzd le a kereséshez</span>
      </div>

      <button class="sb-new lg" id="btn-sb-new" data-haptic="impact-light">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5h2v14h-2z"/><path d="M5 11h14v2H5z"/></svg>
        <span>Új beszélgetés</span>
      </button>

      <div class="sb-sec">Legutóbbi</div>
      <div id="hlist"></div>

      <div id="search-status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;"></div>
    </div>
  </div>

  <div id="action-sheet" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="as-backdrop" id="as-backdrop"></div>
    <div class="as-container">
      <div class="as-group lg" id="as-group">
        <div class="as-title-block" id="as-title-block" style="display:none">
          <div class="as-title" id="as-title"></div>
          <div class="as-message" id="as-message" style="display:none"></div>
        </div>
        <div id="as-options"></div>
      </div>
      <button type="button" class="as-cancel lg" id="as-cancel" data-haptic="selection">Mégse</button>
    </div>
  </div>

  <div id="content">
    <div id="scroll-area">
      <div id="msg-list" role="list"></div>
    </div>

    <div id="ib-wrap">
      <div class="ib-inner">
        <div class="img-strip" id="img-strip" style="display:none"></div>
        <div class="ib-row">
          <button class="ibtn lg" id="btn-gal" aria-label="Kép csatolása" type="button" data-haptic="impact-light">
            <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <form class="ibox lg" onsubmit="event.preventDefault();">
            <textarea id="ta" placeholder="Üzenet" rows="1" aria-label="Üzenet" enterkeyhint="enter"></textarea>
          </form>
          <button class="sbtn" id="sbtn" disabled aria-label="Küldés" type="button" data-haptic="impact-medium">
            <svg id="sico" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <button id="stb" class="lg" aria-label="Ugrás az aljára">
    <svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
  </button>

  <div id="toasts" aria-live="polite"></div>

  <div class="ctx-overlay" id="ctx-overlay"></div>
  <div class="ctx-menu lg" id="ctx-menu" role="menu"></div>

</div>

<input type="file" id="fg" style="display:none" multiple>

<script>
(function(){
  "use strict";
  var textarea = document.getElementById("ta");
  var sendButton = document.getElementById("sbtn");
  var messageList = document.getElementById("msg-list");
  var scrollArea = document.getElementById("scroll-area");
  var selectedImages = [];
  var messages = [];
  var busy = false;
  var abortController = null;
  var currentId = null;
  var history = [];
  var STORAGE_KEY = "chat_history_v1";

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, function(character){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[character];
    });
  }

  function toast(message, type){
    var container = document.getElementById("toasts");
    if(!container) return;
    var el = document.createElement("div");
    el.className = "toast lg " + (type || "inf");
    el.innerHTML = "<span>" + escapeHtml(message) + "</span>";
    container.appendChild(el);
    setTimeout(function(){
      el.classList.add("out");
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 220);
    }, 2800);
  }

  function markdown(value){
    if(typeof value !== "string") value = "";
    var placeholders = [];
    var text = value.replace(/```([\s\S]*?)```/g, function(match, code){
      var idx = placeholders.length;
      var lang = "";
      var body = code;
      var firstNL = code.indexOf("\n");
      if(firstNL > 0 && firstNL < 40){
        var maybe = code.slice(0, firstNL).trim();
        if(/^[a-zA-Z0-9_+-]+$/.test(maybe)){
          lang = maybe;
          body = code.slice(firstNL + 1);
        }
      }
      placeholders.push('<div class="cb"><div class="cb-hdr"><span class="cb-lang">' + escapeHtml(lang || "code") + '</span><button type="button" class="cb-copy" data-copy="' + idx + '">Másolás</button></div><pre><code>' + escapeHtml(body.replace(/\n$/, "")) + '</code></pre></div>');
      return "\0CB" + idx + "\0";
    });
    text = escapeHtml(text);
    text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/`([^`]+)`/g, '<span class="ic">$1</span>');
    text = text.replace(/\n/g, "<br>");
    text = text.replace(/\0CB(\d+)\0/g, function(_, i){ return placeholders[parseInt(i, 10)] || ""; });
    return text;
  }

  function splitAssistantMessage(message){
    var content = typeof message.content === "string" ? message.content : "";
    var thinking = typeof message.reasoning_content === "string" ? message.reasoning_content : "";
    var thinkBlocks = [];
    var re = /<think>([\s\S]*?)<\/think>/g;
    var m;
    while((m = re.exec(content)) !== null){
      thinkBlocks.push(m[1].trim());
    }
    content = content.replace(/<think>[\s\S]*?<\/think>/g, "");
    if(thinkBlocks.length){
      thinking = thinking ? thinking + "\n" + thinkBlocks.join("\n") : thinkBlocks.join("\n");
    } else {
      var endOnly = content.indexOf("</think>");
      if(endOnly !== -1 && content.indexOf("<think>") === -1){
        var leading = content.slice(0, endOnly).trim();
        if(leading){
          thinking = thinking ? thinking + "\n" + leading : leading;
          content = content.slice(endOnly + 8);
        }
      }
    }
    return { content: content.trim(), thinking: thinking.trim() };
  }

  function contentToDisplay(content){
    if(typeof content === "string") return { text: content, images: [] };
    if(Array.isArray(content)){
      var text = "";
      var images = [];
      content.forEach(function(part){
        if(!part) return;
        if(part.type === "text" && typeof part.text === "string") text += (text ? "\n" : "") + part.text;
        if(part.type === "image_url" && part.image_url && part.image_url.url) images.push(part.image_url.url);
      });
      return { text: text, images: images };
    }
    return { text: String(content), images: [] };
  }

  function renderMessageImages(images){
    if(!images || !images.length) return "";
    return images.map(function(src){
      return '<div class="img-in-msg"><img src="' + escapeHtml(src) + '" alt="" loading="lazy"></div>';
    }).join("");
  }

  function isNearBottom(){
    if(!scrollArea) return true;
    return scrollArea.scrollHeight - scrollArea.scrollTop - scrollArea.clientHeight < 120;
  }

  function updateScrollButton(){
    var stb = document.getElementById("stb");
    if(!stb) return;
    if(scrollArea && scrollArea.scrollHeight - scrollArea.scrollTop - scrollArea.clientHeight > 160){
      stb.classList.add("show");
    } else {
      stb.classList.remove("show");
    }
  }

  function render(){
    messageList.innerHTML = messages.map(function(message){
      var user = message.role === "user";
      var disp = contentToDisplay(message.content);
      if(user){
        return '<div class="msg-group u" role="listitem">' + renderMessageImages(disp.images) + '<div class="bubble">' + markdown(disp.text) + '</div></div>';
      }
      var thinking = typeof message.thinking === "string" ? message.thinking : "";
      var thinkingHtml = thinking ? '<details class="thinking" open><summary>Gondolkodás</summary><div class="thinking-text">' + markdown(thinking) + '</div></details>' : "";
      var bodyHtml = message.isError ? '<div class="err-bbl">' + markdown(disp.text) + '</div>' : '<div class="ai-bubble md">' + markdown(disp.text) + '</div>';
      return '<div class="msg-group a" role="listitem">' + thinkingHtml + bodyHtml + '</div>';
    }).join("");
    if(isNearBottom()) scrollArea.scrollTop = scrollArea.scrollHeight;
    updateScrollButton();
    messageList.querySelectorAll(".cb-copy").forEach(function(btn){
      btn.addEventListener("click", function(){
        var pre = btn.closest(".cb");
        if(!pre) return;
        var code = pre.querySelector("code");
        if(!code) return;
        var t = code.textContent || "";
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(function(){ toast("Másolva", "ok"); }).catch(function(){});
        }
      });
    });
    if(typeof window.scheduleBridgeFlush === "function") window.scheduleBridgeFlush();
  }

  function setBusy(value){
    busy = value;
    sendButton.disabled = !value && !textarea.value.trim() && !selectedImages.length;
    sendButton.classList.toggle("stop", value);
    sendButton.setAttribute("aria-label", value ? "Leállítás" : "Küldés");
    sendButton.innerHTML = value ? '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>' : '<svg id="sico" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  }

  function imageData(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error("Nem sikerült beolvasni a fájlt")); };
      reader.readAsDataURL(file);
    });
  }

  function addImageParts(text){
    if(!selectedImages.length) return text;
    var parts = [{type:"text", text:text}];
    selectedImages.forEach(function(image){
      parts.push({type:"image_url", image_url:{url:image}});
    });
    return parts;
  }

  function updateImgStrip(){
    var strip = document.getElementById("img-strip");
    if(!strip) return;
    if(!selectedImages.length){
      strip.style.display = "none";
      strip.innerHTML = "";
      return;
    }
    strip.style.display = "flex";
    strip.innerHTML = selectedImages.map(function(src, i){
      return '<div class="img-thumb"><img src="' + escapeHtml(src) + '" alt=""><button type="button" class="img-rm" data-i="' + i + '" aria-label="Eltávolítás">×</button></div>';
    }).join("");
    strip.querySelectorAll(".img-rm").forEach(function(btn){
      btn.addEventListener("click", function(){
        var i = parseInt(btn.getAttribute("data-i"), 10);
        selectedImages.splice(i, 1);
        updateImgStrip();
        sendButton.disabled = busy ? false : !textarea.value.trim() && !selectedImages.length;
      });
    });
  }

  function loadHistory(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      history = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(history)) history = [];
    }catch(e){ history = []; }
  }

  function saveHistory(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      return true;
    }catch(e){
      toast("A beszélgetés mentése nem sikerült.", "err");
      return false;
    }
  }

  function previewText(msgs){
    for(var i = 0; i < msgs.length; i++){
      if(msgs[i].role === "user"){
        var d = contentToDisplay(msgs[i].content);
        var t = (d.text || "").trim();
        if(t) return t.slice(0, 80);
        if(d.images.length) return "Kép";
      }
    }
    return "Üres beszélgetés";
  }

  function persistCurrent(){
    if(!messages.length) return;
    var title = previewText(messages);
    if(currentId){
      for(var i = 0; i < history.length; i++){
        if(history[i].id === currentId){
          history[i].messages = messages.slice();
          history[i].title = title;
          history[i].updated = Date.now();
          saveHistory();
          if(window.renderHistoryList) window.renderHistoryList();
          return;
        }
      }
    }
    currentId = "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    history.unshift({ id: currentId, title: title, messages: messages.slice(), updated: Date.now(), pinned: false });
    saveHistory();
    if(window.renderHistoryList) window.renderHistoryList();
  }

  function newConversation(){
    if(busy && abortController) abortController.abort();
    persistCurrent();
    messages = [];
    currentId = null;
    selectedImages = [];
    updateImgStrip();
    textarea.value = "";
    textarea.style.height = "auto";
    setBusy(false);
    render();
    if(window.closeSB) window.closeSB();
    toast("Új beszélgetés", "ok");
  }

  function loadConversation(id){
    if(busy && abortController) abortController.abort();
    persistCurrent();
    var found = null;
    for(var i = 0; i < history.length; i++){
      if(history[i].id === id){ found = history[i]; break; }
    }
    if(!found) return;
    currentId = found.id;
    messages = (found.messages || []).slice();
    selectedImages = [];
    updateImgStrip();
    setBusy(false);
    render();
    if(window.closeSB) window.closeSB();
  }

  function deleteConversation(id){
    history = history.filter(function(h){ return h.id !== id; });
    if(currentId === id){
      messages = [];
      currentId = null;
      render();
    }
    saveHistory();
    if(window.renderHistoryList) window.renderHistoryList();
    toast("Törölve", "ok");
  }

  async function send(){
    if(busy){
      if(abortController) abortController.abort();
      return;
    }
    var text = textarea.value.trim();
    if(!text && !selectedImages.length) return;
    var content = addImageParts(text || "Elemezd a csatolt képet.");
    messages.push({role:"user", content:content});
    persistCurrent();
    textarea.value = "";
    textarea.style.height = "auto";
    selectedImages = [];
    updateImgStrip();
    render();
    setBusy(true);
    abortController = new AbortController();
    try{
      var modelMessages = messages.map(function(message){
        return {role: message.role, content: message.content};
      });
      var response = await fetch("/api/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:modelMessages, max_tokens:4096, temperature:0.7, top_p:0.9, stream:true}),
        signal: abortController.signal
      });
      if(!response.ok){
        var errorResult = await response.json().catch(function(){ return null; });
        throw new Error(errorResult && errorResult.error && errorResult.error.message ? errorResult.error.message : "A modell nem válaszolt.");
      }
      if(!response.body) throw new Error("A modell nem küldött választ.");
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      var answer = "";
      var thinking = "";
      while(true){
        var read = await reader.read();
        if(read.done) break;
        buffer += decoder.decode(read.value, {stream:true});
        var blocks = buffer.split("\n\n");
        buffer = blocks.pop() || "";
        blocks.forEach(function(block){
          var lines = block.split("\n");
          lines.forEach(function(line){
            if(line.indexOf("data:") !== 0) return;
            var raw = line.slice(5).trim();
            if(!raw || raw === "[DONE]") return;
            var event;
            try{ event = JSON.parse(raw); }catch(e){ return; }
            if(event.error) throw new Error(event.error.message || "A modell nem válaszolt.");
            var delta = event.choices && event.choices[0] && event.choices[0].delta;
            if(!delta) return;
            if(typeof delta.content === "string") answer += delta.content;
            if(typeof delta.reasoning_content === "string") thinking += delta.reasoning_content;
          });
        });
      }
      var parsedMessage = splitAssistantMessage({content:answer, reasoning_content:thinking});
      if(!parsedMessage.content && !parsedMessage.thinking) throw new Error("A modell üres választ adott.");
      messages.push({role:"assistant", content:parsedMessage.content, thinking:parsedMessage.thinking});
      render();
      persistCurrent();
    }catch(error){
      if(error.name !== "AbortError"){
        messages.push({role:"assistant", content:"Hiba: " + error.message, isError:true});
        render();
        persistCurrent();
        toast(error.message || "Hiba", "err");
      }
    }finally{
      abortController = null;
      setBusy(false);
    }
  }

  textarea.addEventListener("input", function(){
    textarea.style.height = "auto";
    textarea.style.height = Math.min(textarea.scrollHeight, 160) + "px";
    sendButton.disabled = busy ? false : !textarea.value.trim() && !selectedImages.length;
  });
  textarea.addEventListener("keydown", function(event){
    if(event.key === "Enter" && !event.shiftKey){
      event.preventDefault();
      send();
    }
  });
  sendButton.addEventListener("click", send);

  var btnGal = document.getElementById("btn-gal");
  var fg = document.getElementById("fg");
  if(btnGal && fg){
    btnGal.addEventListener("click", function(){ fg.click(); });
  }
  if(fg){
    fg.addEventListener("change", async function(event){
      var files = Array.prototype.slice.call(event.target.files || []);
      var imageFiles = files.filter(function(file){ return file.type.indexOf("image/") === 0; });
      try{
        var results = await Promise.all(imageFiles.map(function(f){
          return imageData(f).catch(function(){ return null; });
        }));
        results.forEach(function(r){ if(r) selectedImages.push(r); });
        updateImgStrip();
        sendButton.disabled = busy ? false : !textarea.value.trim() && !selectedImages.length;
      }catch(e){
        toast("Képolvasási hiba", "err");
      }
      event.target.value = "";
    });
  }

  var stb = document.getElementById("stb");
  if(stb){
    stb.addEventListener("click", function(){
      if(scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: "smooth" });
    });
  }
  if(scrollArea){
    scrollArea.addEventListener("scroll", updateScrollButton, { passive: true });
  }

  loadHistory();
  if(history.length){
    currentId = history[0].id;
    messages = (history[0].messages || []).slice();
    render();
  }
  window.chatApp = {
    newConversation: newConversation,
    loadConversation: loadConversation,
    deleteConversation: deleteConversation,
    persistCurrent: persistCurrent,
    getHistory: function(){ return history; },
    getCurrentId: function(){ return currentId; },
    send: send,
    toast: toast
  };
})();
</script>

<script>
(function(){
  "use strict";

  var sbOpen = false;
  var searchOpen = false;
  var searchQuery = "";

  function $(id){ return document.getElementById(id); }

  var sidebarEl = $("sidebar");
  var contentEl = $("content");
  var sidebarBackdropEl = $("sidebar-backdrop");

  ["gesturestart","gesturechange","gestureend"].forEach(function(evt){
    document.addEventListener(evt, function(e){ e.preventDefault(); }, { passive: false });
  });

  function openSB(){
    if(!sidebarEl) return;
    sbOpen = true;
    sidebarEl.classList.add("open");
    sidebarEl.setAttribute("aria-hidden", "false");
    if(sidebarBackdropEl){
      sidebarBackdropEl.classList.add("open");
      sidebarBackdropEl.setAttribute("aria-hidden", "false");
    }
    if(contentEl) contentEl.setAttribute("inert", "");
    renderHistoryList();
  }

  function closeSB(){
    if(!sidebarEl) return;
    sbOpen = false;
    sidebarEl.classList.remove("open");
    sidebarEl.setAttribute("aria-hidden", "true");
    if(sidebarBackdropEl){
      sidebarBackdropEl.classList.remove("open");
      sidebarBackdropEl.setAttribute("aria-hidden", "true");
    }
    if(contentEl) contentEl.removeAttribute("inert");
    if(searchOpen) closeSearch();
  }

  if(sidebarBackdropEl){
    sidebarBackdropEl.addEventListener("click", closeSB);
  }

  function openSearch(){
    searchOpen = true;
    var bar = $("sb-search-bar");
    if(bar) bar.classList.add("open");
    requestAnimationFrame(function(){
      var q = $("sb-q");
      if(q) q.focus();
    });
  }

  function closeSearch(){
    searchOpen = false;
    searchQuery = "";
    var q = $("sb-q");
    if(q) q.value = "";
    var bar = $("sb-search-bar");
    if(bar) bar.classList.remove("open");
    if(q) q.blur();
    renderHistoryList();
  }

  var btnSbSearch = $("btn-sb-search");
  if(btnSbSearch){
    btnSbSearch.addEventListener("click", function(){
      if(searchOpen) closeSearch(); else openSearch();
    });
  }
  var sbQCancel = $("sb-q-cancel");
  if(sbQCancel){
    sbQCancel.addEventListener("click", closeSearch);
  }

  var searchDebounce = null;
  var sbQ = $("sb-q");
  if(sbQ){
    sbQ.addEventListener("input", function(e){
      var val = e.target.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(function(){
        searchQuery = val;
        renderHistoryList();
      }, 100);
    });
  }

  function updateSearchStatus(count, q){
    var st = $("search-status");
    if(!st) return;
    if(!q){ st.textContent = ""; return; }
    st.textContent = count === 0 ? "Nincs találat: " + q : count + " találat: " + q;
  }

  function formatMeta(ts){
    if(!ts) return "";
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return d.toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString("hu-HU", { month: "short", day: "numeric" });
  }

  function renderHistoryList(){
    var list = $("hlist");
    if(!list) return;
    var hist = (window.chatApp && window.chatApp.getHistory) ? window.chatApp.getHistory() : [];
    var cur = (window.chatApp && window.chatApp.getCurrentId) ? window.chatApp.getCurrentId() : null;
    var q = (searchQuery || "").trim().toLowerCase();
    var filtered = hist.filter(function(h){
      if(!q) return true;
      var title = (h.title || "").toLowerCase();
      if(title.indexOf(q) !== -1) return true;
      if(Array.isArray(h.messages)){
        for(var i = 0; i < h.messages.length; i++){
          var c = h.messages[i].content;
          var t = typeof c === "string" ? c : (Array.isArray(c) ? c.map(function(p){ return p && p.text || ""; }).join(" ") : "");
          if(String(t).toLowerCase().indexOf(q) !== -1) return true;
        }
      }
      return false;
    });
    updateSearchStatus(filtered.length, q);
    if(!filtered.length){
      list.innerHTML = '<div class="h-empty"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><p>' + (q ? "Nincs találat" : "Még nincsenek beszélgetések") + '</p></div>';
      return;
    }
    list.innerHTML = filtered.map(function(h){
      var active = h.id === cur ? " active" : "";
      var pinned = h.pinned ? " pinned" : "";
      var title = escapeHtmlAttr(h.title || "Beszélgetés");
      var meta = formatMeta(h.updated);
      var markTitle = title;
      if(q){
        var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
        markTitle = title.replace(re, "<mark>$1</mark>");
      }
      return '<div class="hcard' + active + pinned + '" data-id="' + escapeHtmlAttr(h.id) + '" role="button" tabindex="0">' +
        '<div class="hcard-body"><div class="hcard-pre"><span class="hcard-pin"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg></span>' + markTitle + '</div>' +
        '<div class="hcard-meta">' + escapeHtmlAttr(meta) + '</div></div>' +
        '<button type="button" class="hcard-del" data-id="' + escapeHtmlAttr(h.id) + '" aria-label="Törlés"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button></div>';
    }).join("");

    list.querySelectorAll(".hcard").forEach(function(card){
      card.addEventListener("click", function(e){
        if(e.target.closest(".hcard-del")) return;
        var id = card.getAttribute("data-id");
        if(id && window.chatApp) window.chatApp.loadConversation(id);
      });
      card.addEventListener("contextmenu", function(e){
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, card.getAttribute("data-id"));
      });
    });
    list.querySelectorAll(".hcard-del").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        openActionSheet("Beszélgetés törlése", "Biztosan törölni szeretnéd?", [
          { label: "Törlés", destructive: true, action: function(){ if(window.chatApp) window.chatApp.deleteConversation(id); } }
        ]);
      });
    });
  }

  function escapeHtmlAttr(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
    });
  }

  function openActionSheet(title, message, options){
    var sheet = $("action-sheet");
    var titleEl = $("as-title");
    var msgEl = $("as-message");
    var titleBlock = $("as-title-block");
    var optsEl = $("as-options");
    if(!sheet || !optsEl) return;
    if(titleEl) titleEl.textContent = title || "";
    if(msgEl){
      if(message){ msgEl.textContent = message; msgEl.style.display = ""; }
      else { msgEl.style.display = "none"; }
    }
    if(titleBlock) titleBlock.style.display = title ? "" : "none";
    optsEl.innerHTML = "";
    (options || []).forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "as-option" + (opt.destructive ? " destructive" : "");
      b.textContent = opt.label;
      b.addEventListener("click", function(){
        closeActionSheet();
        if(typeof opt.action === "function") opt.action();
      });
      optsEl.appendChild(b);
    });
    sheet.setAttribute("aria-hidden", "false");
  }

  function closeActionSheet(){
    var sheet = $("action-sheet");
    if(sheet) sheet.setAttribute("aria-hidden", "true");
  }

  var asCancel = $("as-cancel");
  if(asCancel) asCancel.addEventListener("click", closeActionSheet);
  var asBackdrop = $("as-backdrop");
  if(asBackdrop) asBackdrop.addEventListener("click", closeActionSheet);

  function showCtxMenu(x, y, id){
    var menu = $("ctx-menu");
    var overlay = $("ctx-overlay");
    if(!menu || !overlay) return;
    menu.innerHTML =
      '<button type="button" class="ctx-item" data-act="open"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>Megnyitás</button>' +
      '<button type="button" class="ctx-item" data-act="pin"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>Kitűzés</button>' +
      '<button type="button" class="ctx-item danger" data-act="del"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Törlés</button>';
    menu.style.left = Math.min(x, window.innerWidth - 220) + "px";
    menu.style.top = Math.min(y, window.innerHeight - 160) + "px";
    menu.classList.add("vis");
    overlay.classList.add("vis");
    menu.querySelectorAll(".ctx-item").forEach(function(item){
      item.addEventListener("click", function(){
        var act = item.getAttribute("data-act");
        hideCtxMenu();
        if(act === "open" && window.chatApp) window.chatApp.loadConversation(id);
        if(act === "del"){
          openActionSheet("Beszélgetés törlése", "Biztosan törölni szeretnéd?", [
            { label: "Törlés", destructive: true, action: function(){ if(window.chatApp) window.chatApp.deleteConversation(id); } }
          ]);
        }
        if(act === "pin"){
          var hist = window.chatApp && window.chatApp.getHistory ? window.chatApp.getHistory() : [];
          for(var i = 0; i < hist.length; i++){
            if(hist[i].id === id){ hist[i].pinned = !hist[i].pinned; break; }
          }
          try{ localStorage.setItem("chat_history_v1", JSON.stringify(hist)); }catch(e){}
          renderHistoryList();
        }
      });
    });
  }

  function hideCtxMenu(){
    var menu = $("ctx-menu");
    var overlay = $("ctx-overlay");
    if(menu) menu.classList.remove("vis");
    if(overlay) overlay.classList.remove("vis");
  }

  var ctxOverlay = $("ctx-overlay");
  if(ctxOverlay) ctxOverlay.addEventListener("click", hideCtxMenu);

  var sbBody = document.querySelector(".sb-body");
  if(sbBody){
    var pullArmed = false;
    var pullStartY = 0;
    sbBody.addEventListener("touchstart", function(e){
      if(sbBody.scrollTop <= 0 && !searchOpen){
        pullArmed = true;
        pullStartY = e.touches[0].clientY;
      } else {
        pullArmed = false;
      }
    }, { passive: true });

    sbBody.addEventListener("touchmove", function(e){
      if(!pullArmed) return;
      var dy = e.touches[0].clientY - pullStartY;
      if(dy > 12){
        sidebarEl.classList.add("pull-hinting");
      }
      if(dy > 72){
        openSearch();
        pullArmed = false;
        sidebarEl.classList.remove("pull-hinting");
      }
    }, { passive: true });

    function disarmPull(){
      pullArmed = false;
      sidebarEl.classList.remove("pull-hinting");
    }
    sbBody.addEventListener("touchend", disarmPull, { passive: true });
    sbBody.addEventListener("touchcancel", disarmPull, { passive: true });
  }

  (function(){
    var touchId = null;
    var startX = 0, startY = 0, lastDx = 0;
    var dir = null;
    var w = 0;

    document.addEventListener("touchstart", function(e){
      if(touchId !== null) return;
      var t = e.changedTouches[0];
      if(!sbOpen && t.clientX > 40) return;
      touchId = t.identifier;
      startX = t.clientX;
      startY = t.clientY;
      lastDx = 0;
      dir = null;
      w = (sidebarEl && sidebarEl.getBoundingClientRect().width) || window.innerWidth;
    }, { passive: true });

    document.addEventListener("touchmove", function(e){
      if(touchId === null) return;
      var t = null;
      for(var i = 0; i < e.changedTouches.length; i++){
        if(e.changedTouches[i].identifier === touchId){ t = e.changedTouches[i]; break; }
      }
      if(!t) return;
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      lastDx = dx;

      if(dir === null){
        if(Math.abs(dx) + Math.abs(dy) >= 6){
          dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
        }
      }
      if(dir === "v"){
        touchId = null;
        return;
      }
      if(dir === "h"){
        if(!sbOpen && startX < 36 && dx > 0){
          sidebarEl.classList.add("dragging");
          var pct = Math.min(0, -100 + (dx / w) * 100);
          sidebarEl.style.transform = "translateX(" + pct + "%)";
        } else if(sbOpen && dx < 0){
          sidebarEl.classList.add("dragging");
          var pct2 = Math.max(-100, (dx / w) * 100);
          sidebarEl.style.transform = "translateX(" + pct2 + "%)";
        }
      }
    }, { passive: true });

    document.addEventListener("touchend", function(e){
      if(touchId === null) return;
      var found = false;
      for(var i = 0; i < e.changedTouches.length; i++){
        if(e.changedTouches[i].identifier === touchId){ found = true; break; }
      }
      if(!found) return;

      sidebarEl.classList.remove("dragging");
      sidebarEl.style.transform = "";
      var threshold = Math.max(80, Math.min(w * 0.18, 140));
      if(!sbOpen && lastDx > threshold){
        openSB();
      } else if(sbOpen && lastDx < -threshold){
        closeSB();
      }
      touchId = null;
      dir = null;
      lastDx = 0;
    }, { passive: true });

    document.addEventListener("touchcancel", function(){
      if(touchId === null) return;
      sidebarEl.classList.remove("dragging");
      sidebarEl.style.transform = "";
      touchId = null;
      dir = null;
      lastDx = 0;
    }, { passive: true });
  })();

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(document.getElementById("action-sheet") && document.getElementById("action-sheet").getAttribute("aria-hidden") === "false") closeActionSheet();
      else if(document.getElementById("ctx-menu") && document.getElementById("ctx-menu").classList.contains("vis")) hideCtxMenu();
      else if(sbOpen) closeSB();
      else if(searchOpen) closeSearch();
    } else if((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
      e.preventDefault();
      if(sbOpen) closeSB(); else openSB();
    }
  });

  var btnSbNew = $("btn-sb-new");
  if(btnSbNew){
    btnSbNew.addEventListener("click", function(){
      if(window.chatApp) window.chatApp.newConversation();
      else closeSB();
    });
  }

  var ta = $("ta");
  if(ta){
    ta.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.stopPropagation();
      }
    });
  }

  window.openSB = openSB;
  window.closeSB = closeSB;
  window.openSearch = openSearch;
  window.closeSearch = closeSearch;
  window.renderHistoryList = renderHistoryList;

  renderHistoryList();
})();
</script>


<script>
(() => {
  "use strict";

  const PROFILE = {
    refThickness: 20, refFactor: 1.4, refDispersion: 7,
    refFresnelRange: 30, refFresnelHardness: 20, refFresnelFactor: 20,
    glareRange: 30, glareHardness: 20, glareFactor: 28,
    glareConvergence: 73.66, glareOppositeFactor: 40, glareAngle: -45,
    blurRadius: 1, blurEdge: true,
    tint: { r: 255, g: 255, b: 255, a: 0 },
    shadowExpand: 25, shadowFactor: 15, shadowPosition: { x: 0, y: -10 },
    bgType: 3, shapeWidth: 200, shapeHeight: 200, shapeRadius: 80,
    shapeRoundness: 5, mergeRate: 0.05, showShape1: true,
    springSizeFactor: 10, step: 9
  };
  const MAX_SHAPES = 48;
  const KERNEL_MAX = 201;

  const canvas = document.getElementById("glass-renderer-canvas");
  if(!canvas) return;

  const gl = canvas.getContext("webgl2", { alpha: true, antialias: true, premultipliedAlpha: true, desynchronized: true });
  if(!gl) return;
  if(!gl.getExtension("EXT_color_buffer_float")) return;

  const VS_SRC = `#version 300 es
  precision highp float;
  out vec2 vUv;
  void main(){
    vec2 P[3];
    P[0] = vec2(-1.0, -1.0);
    P[1] = vec2( 3.0, -1.0);
    P[2] = vec2(-1.0,  3.0);
    vec2 p = P[gl_VertexID];
    vUv = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
  }`;

  const BG_FS_SRC = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 fragColor;
  uniform vec2 uRes;
  uniform float uTime;

  vec3 pal(float t){
    return vec3(0.04,0.06,0.16) + 0.18*cos(6.28318*(vec3(0.22,0.32,0.45)*t + vec3(0.55,0.65,0.75)));
  }

  void main(){
    vec2 p = (vUv - 0.5) * vec2(uRes.x/uRes.y, 1.0);
    float t = uTime * 0.045;
    vec3 c = vec3(0.02,0.024,0.05);
    for(int i = 0; i < 4; i++){
      float f = float(i);
      vec2 d = vec2(sin(t*0.2 + f*1.7), cos(t*0.17 + f*1.3)) * 0.42;
      float m = smoothstep(1.0, 0.0, length(p - d));
      c += pal(f*0.17 + t*0.03) * m * 0.35;
    }
    c *= 0.9 + 0.18*pow(vUv.x*(1.0-vUv.x)*vUv.y*(1.0-vUv.y)*16.0, 0.18);
    fragColor = vec4(c, 1.0);
  }`;

  const BLUR_FS_SRC = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 fragColor;
  uniform sampler2D uTex;
  uniform vec2 uTexel;
  uniform vec2 uDir;
  uniform float uWeights[201];
  uniform int uRadius;

  void main(){
    vec4 sum = texture(uTex, vUv) * uWeights[0];
    for(int i = 1; i <= 200; i++){
      if(i > uRadius) break;
      vec2 o = uTexel * uDir * float(i);
      sum += texture(uTex, vUv + o) * uWeights[i];
      sum += texture(uTex, vUv - o) * uWeights[i];
    }
    fragColor = sum;
  }`;

  const MAIN_FS_SRC = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 fragColor;

  uniform sampler2D uBg;
  uniform sampler2D uBlur;
  uniform vec2 uRes;
  uniform float uDpr;
  uniform float uTime;
  uniform int uShapeCount;
  uniform vec4 uRects[48];
  uniform float uRadii[48];
  uniform float uThickness;
  uniform float uRefFactor;
  uniform float uDispersion;
  uniform float uFresnelRange;
  uniform float uFresnelHardness;
  uniform float uFresnelFactor;
  uniform float uGlareRange;
  uniform float uGlareHardness;
  uniform float uGlareFactor;
  uniform float uGlareConvergence;
  uniform float uGlareOppositeFactor;
  uniform float uGlareAngle;
  uniform vec4 uTint;
  uniform int uStep;

  float sdRoundRect(vec2 p, vec2 b, float r){
    vec2 q = abs(p) - b + vec2(r);
    return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
  }

  float sdfScene(vec2 px, out int hitIdx){
    float best = 1e9;
    hitIdx = -1;
    for(int i = 0; i < 48; i++){
      if(i >= uShapeCount) break;
      vec4 rc = uRects[i];
      vec2 center = rc.xy + rc.zw * 0.5;
      vec2 half_ = max(rc.zw * 0.5 - 1.0, vec2(1.0));
      float r = max(1.0, uRadii[i]);
      float d = sdRoundRect(px - center, half_, r);
      if(d < best){
        best = d;
        hitIdx = i;
      }
    }
    return best;
  }

  vec2 nrm(vec2 px){
    float eps = max(1.0, uDpr) + 1e-6;
    int hi;
    float dx = sdfScene(px + vec2(eps, 0.0), hi) - sdfScene(px - vec2(eps, 0.0), hi);
    float dy = sdfScene(px + vec2(0.0, eps), hi) - sdfScene(px - vec2(0.0, eps), hi);
    vec2 g = vec2(dx, dy);
    float len = length(g);
    return len > 1e-6 ? g / len : vec2(0.0, -1.0);
  }

  void main(){
    vec2 px = vUv * uRes;
    vec3 bg = texture(uBg, vUv).rgb;
    vec3 blur = texture(uBlur, vUv).rgb;

    int hi;
    float sdf = sdfScene(px, hi);

    if(hi < 0){
      fragColor = vec4(bg, 1.0);
      return;
    }

    vec2 n = nrm(px);
    float inside = step(sdf, 0.0);
    float edgeBand = 1.0 - smoothstep(0.0, max(1.0, uThickness), abs(sdf));
    float edge = inside * edgeBand;
    float incidence = clamp(1.0 - abs(dot(n, vec2(0.0, -1.0))), 0.0, 1.0);
    float ref = edge * incidence * uRefFactor;
    vec2 off = (n * ref * 14.0) / uRes;
    float disp = uDispersion / max(uRes.x, uRes.y);

    float rC = texture(uBlur, vUv + off*0.98 + n*disp*0.98).r;
    float gC = texture(uBlur, vUv + off*1.00).g;
    float bC = texture(uBlur, vUv + off*1.02 - n*disp*1.02).b;
    vec3 refr = vec3(rC, gC, bC);

    vec3 glass = mix(blur, refr, 0.92);

    float fresBand = 1.0 - smoothstep(0.0, max(1.0, uFresnelRange), abs(sdf));
    float fres = pow(clamp(fresBand, 0.0, 1.0), max(0.001, uFresnelHardness*0.15)) * (uFresnelFactor/20.0);
    vec3 fresCol = mix(vec3(1.0), uTint.rgb, uTint.a);

    vec2 gd = normalize(vec2(cos(radians(uGlareAngle)), sin(radians(uGlareAngle))));
    float ndg = max(dot(n, gd), 0.0);
    float glare = pow(edge * smoothstep(0.0, 1.0, ndg), max(0.001, uGlareHardness*0.15)) * (uGlareFactor/90.0);
    glare *= mix(uGlareOppositeFactor/100.0, 1.0, ndg);
    glare *= smoothstep(0.0, 1.0, uGlareConvergence/100.0 + 0.25);

    vec3 comp = mix(bg, mix(glass, fresCol, clamp(fres*0.5, 0.0, 0.9)) + vec3(1.0)*glare*0.45, inside);

    if(uStep == 1){ fragColor = vec4(vec3(clamp(0.5 - sdf/80.0, 0.0, 1.0)), 1.0); return; }
    if(uStep == 2){ fragColor = vec4(n*0.5+0.5, 0.0, 1.0); return; }
    if(uStep == 3){ fragColor = vec4(vec3(edge), 1.0); return; }
    if(uStep == 4){ fragColor = vec4(blur, 1.0); return; }
    if(uStep == 5){ fragColor = vec4(refr, 1.0); return; }
    if(uStep == 6){ fragColor = vec4(vec3(fres), 1.0); return; }
    if(uStep == 7){ fragColor = vec4(vec3(glare), 1.0); return; }
    if(uStep == 8){ fragColor = vec4(vec3(inside), 1.0); return; }
    if(uStep == 9){ fragColor = vec4(bg, 1.0); return; }

    fragColor = vec4(comp, 1.0);
  }`;

  function sh(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      const log = gl.getShaderInfoLog(s);
      gl.deleteShader(s);
      throw new Error(log);
    }
    return s;
  }

  function prog(vs, fs){
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
      const log = gl.getProgramInfoLog(p);
      gl.deleteProgram(p);
      throw new Error(log);
    }
    return p;
  }

  function tex(w, h){
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  function fbo(w, h){
    const texture = tex(w, h);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, texture, w, h };
  }

  function kernel(radius){
    const sigma = Math.max(radius/3, 0.001);
    const arr = new Float32Array(KERNEL_MAX);
    let sum = 0;
    for(let i = 0; i <= radius && i < KERNEL_MAX; i++){
      const w = Math.exp(-(i*i)/(2*sigma*sigma));
      arr[i] = w;
      sum += (i === 0) ? w : w*2;
    }
    if(sum > 0){
      for(let i = 0; i < KERNEL_MAX; i++) arr[i] /= sum;
    }
    return arr;
  }

  function uloc(program, names){
    const out = {};
    for(const n of names){
      out[n] = gl.getUniformLocation(program, n);
    }
    return out;
  }

  class MultiPassRenderer{
    constructor(){
      const vs = sh(gl.VERTEX_SHADER, VS_SRC);
      const bgFs = sh(gl.FRAGMENT_SHADER, BG_FS_SRC);
      const blurFs = sh(gl.FRAGMENT_SHADER, BLUR_FS_SRC);
      const mainFs = sh(gl.FRAGMENT_SHADER, MAIN_FS_SRC);

      this.bgProg = prog(vs, bgFs);
      this.blurProg = prog(vs, blurFs);
      this.mainProg = prog(vs, mainFs);

      this.bgU = uloc(this.bgProg, ["uRes","uTime"]);
      this.blurU = uloc(this.blurProg, ["uTex","uTexel","uDir","uWeights","uRadius"]);
      this.mainU = uloc(this.mainProg, [
        "uBg","uBlur","uRes","uDpr","uTime","uShapeCount","uRects","uRadii",
        "uThickness","uRefFactor","uDispersion","uFresnelRange","uFresnelHardness","uFresnelFactor",
        "uGlareRange","uGlareHardness","uGlareFactor","uGlareConvergence","uGlareOppositeFactor","uGlareAngle",
        "uTint","uStep"
      ]);

      this.rects = new Float32Array(MAX_SHAPES*4);
      this.radii = new Float32Array(MAX_SHAPES);
      this.count = 0;
      this.radius = Math.max(1, Math.min(200, PROFILE.blurRadius|0));
      this.weights = kernel(this.radius);
      this._radCache = new WeakMap();
      this._lastCollect = 0;

      this.vao = gl.createVertexArray();
      gl.bindVertexArray(this.vao);

      this.bg = null; this.vb = null; this.hb = null;
      this.resize();
    }

    resize(){
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      const w = Math.max(1, Math.round(window.innerWidth * dpr));
      const h = Math.max(1, Math.round(window.innerHeight * dpr));
      canvas.width = w;
      canvas.height = h;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      gl.viewport(0, 0, w, h);
      this.dpr = dpr;

      if(!this.bg){
        this.bg = fbo(w, h);
        this.vb = fbo(w, h);
        this.hb = fbo(w, h);
      } else {
        [this.bg, this.vb, this.hb].forEach((f) => {
          gl.bindTexture(gl.TEXTURE_2D, f.texture);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
          f.w = w; f.h = h;
        });
      }
    }

    collect(){
      const SEL = ".glass-host, .lg, #sidebar, .ibox, .ctx-menu, .as-group, .as-cancel, .cb, .toast, #stb, .src-chip, .srch-bar, .file-chip, .sb-si, .sb-new, .u .bubble, .hcard.active, .rcn-bar";
      let list;
      try{ list = document.querySelectorAll(SEL); }
      catch(e){ list = []; }

      const seen = new Set();
      let idx = 0;
      const dpr = this.dpr;

      for(let i = 0; i < list.length && idx < MAX_SHAPES; i++){
        const el = list[i];
        if(seen.has(el)) continue;
        seen.add(el);
        if(el.offsetParent === null) continue;

        const rect = el.getBoundingClientRect();
        if(rect.width < 8 || rect.height < 8) continue;

        this.rects[idx*4+0] = rect.left * dpr;
        this.rects[idx*4+1] = rect.top * dpr;
        this.rects[idx*4+2] = rect.width * dpr;
        this.rects[idx*4+3] = rect.height * dpr;

        let r = this._radCache.get(el);
        if(r === undefined){
          const cs = window.getComputedStyle(el);
          r = parseFloat(cs.borderTopLeftRadius);
          if(!isFinite(r)) r = 20;
          this._radCache.set(el, r);
        }
        this.radii[idx] = r * dpr;

        idx++;
      }
      this.count = idx;
    }

    bgPass(t){
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.bg.fb);
      gl.viewport(0, 0, this.bg.w, this.bg.h);
      gl.useProgram(this.bgProg);
      gl.uniform2f(this.bgU.uRes, this.bg.w, this.bg.h);
      gl.uniform1f(this.bgU.uTime, t);
      gl.bindVertexArray(this.vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    blurPass(src, dst, dir){
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
      gl.viewport(0, 0, dst.w, dst.h);
      gl.useProgram(this.blurProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, src.texture);
      gl.uniform1i(this.blurU.uTex, 0);
      gl.uniform2f(this.blurU.uTexel, 1/src.w, 1/src.h);
      gl.uniform2f(this.blurU.uDir, dir[0], dir[1]);
      gl.uniform1fv(this.blurU.uWeights, this.weights);
      gl.uniform1i(this.blurU.uRadius, this.radius);
      gl.bindVertexArray(this.vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    mainPass(t){
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(this.mainProg);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.bg.texture);
      gl.uniform1i(this.mainU.uBg, 0);

      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, this.hb.texture);
      gl.uniform1i(this.mainU.uBlur, 1);

      const dpr = this.dpr;
      gl.uniform2f(this.mainU.uRes, canvas.width, canvas.height);
      gl.uniform1f(this.mainU.uDpr, dpr);
      gl.uniform1f(this.mainU.uTime, t);
      gl.uniform1i(this.mainU.uShapeCount, this.count);
      gl.uniform4fv(this.mainU.uRects, this.rects);
      gl.uniform1fv(this.mainU.uRadii, this.radii);
      gl.uniform1f(this.mainU.uThickness, PROFILE.refThickness * dpr);
      gl.uniform1f(this.mainU.uRefFactor, PROFILE.refFactor);
      gl.uniform1f(this.mainU.uDispersion, PROFILE.refDispersion * dpr);
      gl.uniform1f(this.mainU.uFresnelRange, PROFILE.refFresnelRange * dpr);
      gl.uniform1f(this.mainU.uFresnelHardness, PROFILE.refFresnelHardness);
      gl.uniform1f(this.mainU.uFresnelFactor, PROFILE.refFresnelFactor);
      gl.uniform1f(this.mainU.uGlareRange, PROFILE.glareRange * dpr);
      gl.uniform1f(this.mainU.uGlareHardness, PROFILE.glareHardness);
      gl.uniform1f(this.mainU.uGlareFactor, PROFILE.glareFactor);
      gl.uniform1f(this.mainU.uGlareConvergence, PROFILE.glareConvergence);
      gl.uniform1f(this.mainU.uGlareOppositeFactor, PROFILE.glareOppositeFactor);
      gl.uniform1f(this.mainU.uGlareAngle, PROFILE.glareAngle);
      gl.uniform4f(this.mainU.uTint, PROFILE.tint.r/255, PROFILE.tint.g/255, PROFILE.tint.b/255, PROFILE.tint.a);
      gl.uniform1i(this.mainU.uStep, PROFILE.step|0);

      gl.bindVertexArray(this.vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    frame(t){
      if(t - this._lastCollect >= 200){
        this.collect();
        this._lastCollect = t;
      }
      this.bgPass(t*0.001);
      this.blurPass(this.bg, this.vb, [0, 1]);
      this.blurPass(this.vb, this.hb, [1, 0]);
      this.mainPass(t*0.001);
    }
  }

  let renderer;
  try{
    renderer = new MultiPassRenderer();
  }catch(e){
    return;
  }

  let rafHandle = null;

  function loop(t){
    renderer.frame(t);
    rafHandle = requestAnimationFrame(loop);
  }
  rafHandle = requestAnimationFrame(loop);

  window.addEventListener("resize", () => { renderer.resize(); }, { passive: true });

  document.addEventListener("visibilitychange", () => {
    if(document.hidden){
      if(rafHandle !== null){
        cancelAnimationFrame(rafHandle);
        rafHandle = null;
      }
    } else {
      if(rafHandle === null){
        rafHandle = requestAnimationFrame(loop);
      }
    }
  });
})();
</script>

</body>
</html>
